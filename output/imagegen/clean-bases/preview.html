<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clean character bases</title><style>body{font:16px system-ui;background:#f5f6f3;color:#29332d;margin:0;padding:24px}main{max-width:1000px;margin:auto}.figures{display:grid;grid-template-columns:1fr 1fr;gap:20px}figure{margin:0;border-radius:20px;padding:16px;background:#fff}figure.dark{background:#1e1e1e;color:#fff}img{width:100%;max-height:75vh;object-fit:contain}button{padding:12px 18px;border:1px solid #b8c5b9;border-radius:12px;cursor:pointer;margin:8px 0 20px}figcaption{text-align:center}@media(max-width:600px){.figures{grid-template-columns:1fr}}</style><main><h1>Clean white tank-top bases</h1><p>Toggle the background to inspect the transparent edges, arm gaps, and leg gaps.</p><button id="toggle">Switch to dark background</button><div class="figures"><figure><img src="guy-white-tank.png?v=latest-bald-2" alt="Bald guy base in white tank top and gray pants"><figcaption>Bald guy base</figcaption></figure><figure><img src="girl-bald-white-tank.png?v=latest-bald-2" alt="Bald girl base in white tank top and gray pants"><figcaption>Bald girl base</figcaption></figure></div><p>These are updated base images. Clothing overlays and interchangeable hair still need fitting to these silhouettes.</p></main><script>document.getElementById('toggle').addEventListener('click',()=>{const figures=[...document.querySelectorAll('figure')];const dark=!figures[0].classList.contains('dark');figures.forEach(f=>f.classList.toggle('dark',dark));document.getElementById('toggle').textContent=dark?'Switch to light background':'Switch to dark background'});</script></html>
